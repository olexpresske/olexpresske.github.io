<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OlexPress Admin</title><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:12px} .stat{display:inline-block;background:#1e293b;padding:12px 18px;border-radius:14px;margin:4px;text-align:center} .card{background:#fff;color:#111;padding:12px;border-radius:14px;margin:8px 0;font-size:13px}</style></head><body>
<h2>🔑 OlexPress Admin - All Rides</h2>
<div id="stats"></div>
<div id="list">Loading rides from Firebase...</div>
<script>
const cfg={apiKey:"AIzaSyDc6N5dULG6i72EWrLTtunwhbKQxaVi2KY",authDomain:"olexpresske.firebaseapp.com",databaseURL:"https://olexpresske-default-rtdb.firebaseio.com",projectId:"olexpresske",storageBucket:"olexpresske.firebasestorage.app",messagingSenderId:"953335654623",appId:"1:953335654623:web:1b91cbd29c1f63a23ba16a"};
firebase.initializeApp(cfg);const db=firebase.database();
db.ref('rides').on('value',s=>{
let d=s.val();let el=document.getElementById('list');let st=document.getElementById('stats');
if(!d){el.innerHTML='No rides yet';st.innerHTML='';return;}
let list=Object.values(d).sort((a,b)=>b.created-a.created);
let total=list.length;let active=list.filter(x=>['searching','enroute','arrived','boarded'].includes(x.status)).length;
let completed=list.filter(x=>x.status=='completed').length;
let revenue=list.filter(x=>x.status=='completed').reduce((a,x)=>a+(x.price||0),0);
let commission=list.filter(x=>x.status=='completed').reduce((a,x)=>a+(x.commission||0),0);
st.innerHTML=`<div class=stat><div style="font-size:10px;color:#94a3b8">TOTAL RIDES</div><b style="font-size:20px">${total}</b></div><div class=stat><div style="font-size:10px;color:#f59e0b">ACTIVE</div><b style="font-size:20px;color:#f59e0b">${active}</b></div><div class=stat><div style="font-size:10px;color:#22c55e">COMPLETED</div><b style="font-size:20px;color:#22c55e">${completed}</b></div><div class=stat><div style="font-size:10px;color:#94a3b8">TOTAL FARES</div><b>KES ${revenue.toLocaleString()}</b></div><div class=stat><div style="font-size:10px;color:#f59e0b">YOUR 20% COMM</div><b style="color:#f59e0b">KES ${commission.toLocaleString()}</b></div>`;
el.innerHTML='';
list.forEach(r=>{
el.innerHTML+=`<div class=card><b>${r.ticket}</b> ${r.status.toUpperCase()} | ${new Date(r.created).toLocaleString()}<br>📍 ${r.pickup} → ${r.dropoff} | ${r.distance||''}<br>📱 ${r.phone} | 💰 Fare KES ${r.price} | Comm KES ${r.commission} | Driver gets KES ${(r.price-r.commission)}<br><button onclick="firebase.database().ref('rides/${r.ticket}').remove()" style="background:#fee2e2;color:#dc2626;border:none;padding:6px 10px;border-radius:8px;margin-top:6px;font-weight:700">Delete</button></div>`;
});
});
</script></body></html>
