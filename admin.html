<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OlexPress Admin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui}
.app{max-width:900px;margin:0 auto;background:#0f0f0f;min-height:100vh;padding:10px}
.top{border:1px solid #d4af37;border-radius:18px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:#141414}
.top b{color:#d4af37;font-size:26px}
.live{font-size:11px;background:#1a1a1a;border:1px solid #d4af37;color:#d4af37;padding:4px 10px;border-radius:20px}
#map{height:380px;margin:12px 0;border-radius:18px;border:2px solid #2a2a2a;z-index:1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
.stat{background:#171717;border:1px solid #333;border-radius:14px;padding:12px}
.stat small{color:#aaa}
.stat b{font-size:20px;display:block;margin-top:4px}
.gold{color:#d4af37}.green{color:#00ff88}
.card{margin:10px 0;border:1px solid #d4af37;border-radius:16px;background:#171717;padding:12px}
.btns{display:flex;gap:6px;margin-top:8px}
.btn{padding:8px 12px;border-radius:10px;border:0;font-weight:800;font-size:13px;cursor:pointer}
.btn-del{background:#ff3b3b;color:#fff}
.btn-nav{background:#fff;color:#000}
.btn-done{background:#18a957;color:#fff}
.pin{width:32px;height:32px;background:#1f9d4d;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg)}
table{width:100%;border-collapse:collapse;margin-top:10px}
th{color:#d4af37;text-align:left;font-size:12px;padding:8px;border-bottom:1px solid #333}
td{font-size:13px;padding:8px;border-bottom:1px solid #222}
</style>
</head>
<body>
<div class="app">
<div class="top"><div style="display:flex;align-items:center;gap:10px"><div class="pin"><span>🛣️</span></div><b>OlexPress</b><small style="margin-left:6px"> ADMIN</small></div><div class="live">LIVE • Nyandarua • BASE 250+42</div></div>

<div id="map"></div>

<div class="grid">
<div class="stat"><small>Total Jobs</small><b id="tJobs">0</b></div>
<div class="stat"><small>Total Fare</small><b id="tFare" class="green">KES 0</b></div>
<div class="stat"><small>Olex 13.6%</small><b id="tOlex" class="gold">KES 0</b></div>
<div class="stat"><small>Driver Payout</small><b id="tDriver">KES 0</b></div>
</div>

<div id="list"></div>

<table id="tbl">
<thead><tr><th>Customer</th><th>KM</th><th>Fare</th><th>Olex</th><th>Driver</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDc6N5dULG6i72EWrlTtunwhbKQxaVi2KY",
  authDomain: "olexpresske.firebaseapp.com",
  databaseURL: "https://olexpresske-default-rtdb.firebaseio.com",
  projectId: "olexpresske",
  storageBucket: "olexpresske.firebasestorage.app",
  messagingSenderId: "953335654623",
  appId: "1:953335654623:web:1b91cbd29c1f63a23ba16a"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let map=L.map('map').setView([-0.5333,36.45],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let ms=[];

function loadAdmin(){
 db.ref('jobs').on('value', snap=>{
  const data=snap.val()||{};
  const tbody=document.getElementById('tbody'); tbody.innerHTML="";
  const list=document.getElementById('list'); list.innerHTML="";
  ms.forEach(m=>map.removeLayer(m)); ms=[];
  let tj=0, tf=0, to=0, td=0;

  Object.entries(data).reverse().forEach(([id,j])=>{
    if(!j.pickup||!j.drop) return;
    tj++; tf+=j.fare||0;
    const olex=Math.round((j.fare||0)*0.136);
    const driver=Math.round((j.fare||0)*0.864);
    to+=olex; td+=driver;

    // card for mobile
    list.innerHTML+=`
    <div class="card">
      <div style="display:flex;justify-content:space-between"><b>${j.customer}</b><small>${new Date(j.created).toLocaleString()}</small></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px">
        <div><small>Distance</small><br><b>${j.distance} km</b></div>
        <div><small>Fare</small><br><b class="green">KES ${j.fare}</b></div>
        <div><small>Driver</small><br><b class="green">KES ${driver}</b></div>
        <div><small>Olex</small><br><b class="gold">KES ${olex}</b></div>
      </div>
      <div class="btns">
        <button class="btn btn-nav" onclick="view(${j.pickup.lat},${j.pickup.lng},${j.drop.lat},${j.drop.lng})">Map</button>
        <button class="btn btn-del" onclick="delJob('${id}')">Delete</button>
        <button class="btn btn-done" onclick="doneJob('${id}')">Done</button>
      </div>
    </div>`;

    tbody.innerHTML+=`<tr><td>${j.customer}</td><td>${j.distance}</td><td style="color:#00ff88">KES ${j.fare}</td><td style="color:#d4af37">KES ${olex}</td><td>KES ${driver}</td><td>${j.status}</td><td><button class="btn btn-del" onclick="delJob('${id}')">Delete</button></td></tr>`;
    ms.push(L.marker([j.pickup.lat,j.pickup.lng]).addTo(map));
  });

  document.getElementById('tJobs').innerText=tj;
  document.getElementById('tFare').innerText="KES "+tf;
  document.getElementById('tOlex').innerText="KES "+to;
  document.getElementById('tDriver').innerText="KES "+td;
  if(ms.length){ try{map.fitBounds(L.featureGroup(ms).getBounds().pad(0.3))}catch(e){} }
 });
}
loadAdmin();

function view(a,b,c,d){
 ms.forEach(m=>map.removeLayer(m)); ms=[];
 ms.push(L.marker([a,b]).addTo(map).bindPopup("Pickup").openPopup());
 ms.push(L.marker([c,d]).addTo(map).bindPopup("Drop"));
 map.setView([a,b],13);
}
function delJob(id){
 if(!confirm("DELETE this job permanently? This will remove from Firebase.")) return;
 db.ref('jobs/'+id).remove().then(()=>alert("Deleted ✅")).catch(e=>alert(e.message));
}
function doneJob(id){ db.ref('jobs/'+id).update({status:'completed'}); }
</script>
</body>
</html>
