<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OlexPress Admin - Case Handling</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#020617;color:#e2e8f0}
.header{background:#0f172a;padding:14px;border-bottom:1px solid #1e293b;position:sticky;top:0;z-index:20}
button{padding:8px 12px;border-radius:8px;border:0;font-weight:700;cursor:pointer;font-size:11px}
.stat{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:10px;text-align:center}
</style>
</head>
<body>
<div class="header" style="display:flex;justify-content:space-between;align-items:center">
<div style="font-weight:900">👑 OlexPress ADMIN - Ticket Problem Case<div style="font-size:10px;color:#fbbf24">Ticket XXXX has problem → Admin comment + buttons → Driver liable for response</div></div>
<div style="display:flex;gap:6px"><button onclick="load('all')" style="background:#1e293b;color:white">All Tickets</button><button onclick="load('problem')" style="background:#ef4444;color:white">⚠️ Problem Cases</button></div>
</div>

<div style="margin:10px;display:flex;gap:8px">
<div class="stat"><div id="sTotal" style="font-size:18px;font-weight:900">0</div><div style="font-size:9px">TOTAL</div></div>
<div class="stat"><div id="sCase" style="font-size:18px;font-weight:900;color:#ef4444">0</div><div style="font-size:9px">CASE OPENED</div></div>
<div class="stat"><div id="sLiable" style="font-size:18px;font-weight:900;color:#f59e0b">0</div><div style="font-size:9px">DRIVER LIABLE</div></div>
<div class="stat"><div id="sReplied" style="font-size:18px;font-weight:900;color:#22c55e">0</div><div style="font-size:9px">DRIVER REPLIED</div></div>
</div>

<div id="rides"></div>

<script>
var firebaseConfig={apiKey:"AIzaSyD4...",authDomain:"olexpresske.firebaseapp.com",databaseURL:"https://olexpresske-default-rtdb.firebaseio.com",projectId:"olexpresske"};
firebase.initializeApp(firebaseConfig);var db=firebase.database();

function load(filter='all'){
db.ref('rides').orderByChild('ts').limitToLast(80).on('value',s=>{
let html='';let total=0,caseCount=0,liable=0,replied=0;
s.forEach(ch=>{
let k=ch.key;let v=ch.val(); total++;
if(v.caseStatus) caseCount++;
if(v.caseStatus==='liable') liable++;
if(v.driverResponse) replied++;

if(filter==='problem' &&!v.caseStatus) return;

let from=v.from||'-';let to=v.to||'-';let fare=v.fare||0;let name=v.name||'-';let phone=v.phone||'-';
let dateStr=v.date||new Date(v.ts).toLocaleDateString();let clockStr=v.clock||new Date(v.ts).toLocaleTimeString();

html+=`
<div style="background:#0f172a;border:2px solid ${v.caseStatus==='opened'?'#ef4444':v.caseStatus==='liable'?'#f59e0b':v.driverResponse?'#22c55e':'#1e293b'};border-radius:14px;padding:14px;margin:10px">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap"><b style="font-size:14px">🎫 ${k} - ${from} → ${to} • KES ${fare}</b><span style="background:${v.caseStatus==='opened'?'#ef4444':v.caseStatus==='liable'?'#f59e0b':'#1e293b'};color:white;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:800">${v.caseStatus?('CASE '+v.caseStatus.toUpperCase()):v.status.toUpperCase()} • ${dateStr} ${clockStr}</span></div>
<div style="font-size:11px;margin-top:6px;color:#cbd5e1">👤 ${name} • 📞 ${phone} • Ticket: ${k} • Status: ${v.status||'pending'}</div>

<!-- ADMIN PROBLEM CASE BUTTONS - FOR TICKET XXXX -->
<div style="margin-top:12px;background:#020617;border:1px solid #334155;padding:12px;border-radius:10px">
<div style="font-size:12px;font-weight:900;color:#fbbf24">⚠️ PROBLEM HANDLING - Ticket ${k} - Admin Comment Section with Buttons:</div>
<div style="font-size:10px;opacity:.7;margin-top:2px">If ticket ${k} has problem, admin opens case → driver liable for response</div>

<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
<button onclick="adminAction('${k}','hello')" style="background:#3b82f6;color:white">👋 Hello - Check This Ticket ${k}</button>
<button onclick="adminAction('${k}','case_opened')" style="background:#ef4444;color:white">📂 Case Opened - Ticket ${k}</button>
<button onclick="adminAction('${k}','liable')" style="background:#f59e0b;color:white">⚖️ Driver Liable - Must Respond</button>
<button onclick="adminAction('${k}','review')" style="background:#7c3aed;color:white">🔍 Under Review</button>
<button onclick="adminAction('${k}','resolved')" style="background:#16a34a;color:white">✅ Resolved - Case Closed</button>
</div>

<div style="margin-top:10px">
<textarea id="adminMsg-${k}" placeholder="Write comment for ticket ${k} - e.g. Hello check this ticket, client complained, route issue..."></textarea>
<button onclick="sendCaseComment('${k}')" style="background:#2563eb;color:white;width:100%;margin-top:6px;padding:12px;font-size:13px">📤 Send Comment on Ticket ${k} to Driver - Driver Liable</button>
</div>

${v.adminCaseComment?`
<div style="margin-top:10px;background:#eff6ff;color:#0f172a;padding:10px;border-radius:8px">
<div style="font-size:10px;font-weight:900;color:#2563eb">✅ Your Case Comment on ${k} - Sent to driver account:</div>
<div style="font-size:13px;margin-top:4px;font-weight:600">"${v.adminCaseComment.text}"</div>
<div style="font-size:9px;color:#64748b;margin-top:4px">Case: ${v.adminCaseComment.caseType||''} • Ticket: ${k} • ${v.adminCaseComment.time} • Driver MUST respond</div>
</div>
`:''}

${v.driverResponse?`
<div style="margin-top:10px;background:#f0fdf4;border:2px solid #22c55e;padding:12px;border-radius:10px;color:#0f172a">
<div style="font-size:11px;font-weight:900;color:#16a34a">👨‍✈️ DRIVER RESPONDED - Driver liable response received for ticket ${k}:</div>
<div style="font-size:13px;margin-top:6px;background:white;padding:10px;border-radius:6px;border-left:4px solid #16a34a">"${v.driverResponse.text}"</div>
<div style="font-size:9px;color:#64748b;margin-top:6px">Driver replied: ${v.driverResponse.time} • Ticket ${k} • Liable case answered</div>
<div style="display:flex;gap:6px;margin-top:8px">
<button onclick="adminAction('${k}','resolved')" style="background:#16a34a;color:white">✅ Close Case - Driver Responded OK</button>
<button onclick="adminAction('${k}','liable')" style="background:#f59e0b;color:white">⚠️ Still Liable - Need More Info</button>
</div>
</div>
`: v.caseStatus?`<div style="margin-top:8px;background:#fffbeb;border:1px solid #fde68a;padding:8px;border-radius:6px;font-size:11px;color:#92400e;text-align:center">⏳ Case ${v.caseStatus.toUpperCase()} on ticket ${k} - Waiting driver response (Driver is liable) - Message sent to driver.html</div>`:''}

</div>
</div>
`;
});
document.getElementById('rides').innerHTML=html||'<div style="text-align:center;padding:40px;color:#64748b">No tickets</div>';
document.getElementById('sTotal').innerText=total;
document.getElementById('sCase').innerText=caseCount;
document.getElementById('sLiable').innerText=liable;
document.getElementById('sReplied').innerText=replied;
});
}

function adminAction(ticketId,action){
let messages={
hello:`👋 Hello - Check this ticket ${ticketId} - Please review this trip details`,
case_opened:`📂 Case Opened for ticket ${ticketId} - This ticket has reported problem, investigation started`,
liable:`⚖️ Driver Liable - Ticket ${ticketId} - You are liable for response on this ticket, please explain`,
review:`🔍 Under Review - Ticket ${ticketId} is under admin review`,
resolved:`✅ Resolved - Ticket ${ticketId} case closed - Thank you`
};
let msg=messages[action]||action;
let custom=prompt(`Admin action for ticket ${ticketId} [${action}]:`,msg);
if(custom===null) return;
let caseStatus=action==='resolved'?'resolved':action==='liable'?'liable':'opened';
db.ref('rides/'+ticketId).update({
caseStatus:caseStatus,
caseType:action,
caseTime:new Date().toLocaleString()
});
db.ref('rides/'+ticketId+'/adminCaseComment').set({
text:custom,
caseType:action,
caseStatus:caseStatus,
time:new Date().toLocaleString(),
ticket:ticketId,
ts:Date.now(),
requiresDriverResponse: action==='liable' || action==='case_opened'
});
alert(`✅ ${action.toUpperCase()} for ticket ${ticketId} sent to driver! Driver MUST respond - liable`);
}

function sendCaseComment(ticketId){
let txt=document.getElementById(`adminMsg-${ticketId}`).value.trim();
if(!txt) return alert('Write comment for ticket '+ticketId);
db.ref('rides/'+ticketId).update({
caseStatus:'opened',
caseTime:new Date().toLocaleString()
});
db.ref('rides/'+ticketId+'/adminCaseComment').set({
text:txt,
caseType:'custom',
caseStatus:'liable',
time:new Date().toLocaleString(),
ticket:ticketId,
ts:Date.now(),
requiresDriverResponse:true
});
alert(`✅ Comment on specific ticket ${ticketId} sent! Driver liable for response - will show in driver.html`);
}

load('all');
</script>
</body>
</html>
