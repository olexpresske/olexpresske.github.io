<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OlexPress Admin - Owner Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#f8fafc;padding:14px}
.header{background:#0f172a;color:#fff;padding:16px;border-radius:18px;display:flex;justify-content:space-between}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}
.card{background:#fff;border-radius:16px;padding:14px;border:1px solid #e2e8f0}
.card b{font-size:22px}
.table{width:100%;background:#fff;border-radius:16px;border:1px solid #e2e8f0;overflow:hidden}
.row{display:grid;grid-template-columns:1.2fr 1fr 0.8fr 0.6fr 0.8fr 0.8fr;gap:8px;padding:10px 12px;border-bottom:1px solid #f1f5f9;font-size:12px}
.head{background:#f8fafc;font-weight:800}
.badge{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:800;color:#fff}
.green{background:#16a34a}.blue{background:#2563eb}.orange{background:#f59e0b}.gray{background:#64748b}.black{background:#0f172a}
</style>
</head><body>
<div class="header"><div><div style="font-weight:900;font-size:22px">OlexPress Admin</div><div style="font-size:11px;opacity:0.7">Owner • Commission 20% • Gilgil → Nyahururu</div></div><div style="width:10px;height:10px;background:#22c55e;border-radius:50%"></div></div>

<div class="cards">
<div class="card"><div style="font-size:11px;color:#64748b">TOTAL RIDES</div><b id="totalR">0</b></div>
<div class="card"><div style="font-size:11px;color:#64748b">TOTAL FARE</div><b id="totalF">KES 0</b></div>
<div class="card"><div style="font-size:11px;color:#64748b">YOUR COMMISSION 20%</div><b id="totalC" style="color:#16a34a">KES 0</b></div>
<div class="card"><div style="font-size:11px;color:#64748b">ACTIVE NOW</div><b id="active">0</b></div>
</div>

<div class="table" id="table">
<div class="row head"><div>Ticket / Time</div><div>Route / Phone</div><div>Fare</div><div>Comm 20%</div><div>Driver Gets</div><div>Status</div></div>
</div>

<script>
const cfg={apiKey:"AIzaSyDc6N5dULG6i72EWrLTtunwhbKQxaVi2KY",authDomain:"olexpresske.firebaseapp.com",databaseURL:"https://olexpresske-default-rtdb.firebaseio.com",projectId:"olexpresske",storageBucket:"olexpresske.firebasestorage.app",messagingSenderId:"953335654623",appId:"1:953335654623:web:1b91cbd29c1f63a23ba16a"};
firebase.initializeApp(cfg);const db=firebase.database();
db.ref('rides').on('value',s=>{
let data=s.val(); document.querySelectorAll('.row:not(.head)').forEach(r=>r.remove());
let totalR=0,totalF=0,totalC=0,active=0;
if(!data) return;
Object.values(data).sort((a,b)=>b.created-a.created).forEach(r=>{
totalR++; totalF+=r.price||0; totalC+=r.commission||0; if(['searching','enroute','arrived','boarded'].includes(r.status)) active++;
let div=document.createElement('div'); div.className='row';
let time=new Date(r.created||Date.now()).toLocaleString();
let color={searching:'blue',enroute:'orange',arrived:'green',boarded:'black',completed:'gray'}[r.status]||'gray';
div.innerHTML=`<div><b>${r.ticket}</b><br><span style="font-size:10px">${time}</span></div><div>${r.pickup} → ${r.dropoff}<br>${r.phone||''}</div><div><b>KES ${r.price}</b></div><div style="color:#16a34a;font-weight:800">KES ${r.commission}</div><div>KES ${r.price-r.commission}</div><div><span class="badge ${color}">${r.status}</span></div>`;
document.getElementById('table').appendChild(div);
});
document.getElementById('totalR').innerText=totalR;
document.getElementById('totalF').innerText='KES '+totalF.toLocaleString();
document.getElementById('totalC').innerText='KES '+totalC.toLocaleString();
document.getElementById('active').innerText=active;
});
</script>
</body></html>
