<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OlexPress Driver</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:12px}
.card{background:#fff;color:#000;padding:14px;border-radius:16px;margin:10px 0}
button{padding:12px;border:none;border-radius:10px;font-weight:800;margin:4px;cursor:pointer}
.b{padding:4px 8px;border-radius:12px;color:#fff;font-size:10px}</style>
</head><body>
<h3>🚗 OlexPress Driver - LIVE</h3>
<p style="font-size:11px;color:#94a3b8">Gilgil - Ol Kalou - Nyahururu • Firebase olexpresske</p>
<div id="list">Loading rides...</div>
<script>
const cfg={apiKey:"AIzaSyDc6N5dULG6i72EWrLTtunwhbKQxaVi2KY",authDomain:"olexpresske.firebaseapp.com",databaseURL:"https://olexpresske-default-rtdb.firebaseio.com",projectId:"olexpresske",storageBucket:"olexpresske.firebasestorage.app",messagingSenderId:"953335654623",appId:"1:953335654623:web:1b91cbd29c1f63a23ba16a"};
firebase.initializeApp(cfg);const db=firebase.database();
db.ref('rides').on('value',s=>{
let d=s.val();let el=document.getElementById('list');el.innerHTML='';
if(!d){el.innerHTML='No rides yet - book on main site olexpresske.github.io';return;}
Object.values(d).reverse().forEach(r=>{
let gets=(r.price-r.commission)||0;
el.innerHTML+=`<div class=card><b>${r.ticket}</b> <span class=b style="background:#f59e0b">${r.status}</span><br>📍 ${r.pickup} → ${r.dropoff}<br>📱 ${r.phone} • KES ${r.price} • Comm KES ${r.commission} • YOU GET KES ${gets}<br><button style="background:#0f172a;color:#fff" onclick="firebase.database().ref('rides/${r.ticket}').update({status:'enroute'})">ACCEPT</button><button style="background:#22c55e;color:#fff" onclick="firebase.database().ref('rides/${r.ticket}').update({status:'arrived'})">ARRIVED</button><button style="background:#f59e0b;color:#fff" onclick="firebase.database().ref('rides/${r.ticket}').update({status:'boarded'})">BOARDED</button><button style="background:#000;color:#4ade80" onclick="firebase.database().ref('rides/${r.ticket}').update({status:'completed'})">DONE COLLECT ${r.price}</button></div>`;
});
});
</script></body></html>
