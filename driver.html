<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OlexPress Driver - Your Ride Everywhere</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui}
.app{max-width:430px;margin:0 auto;background:#0f0f0f;min-height:100vh;border-left:1px solid #222;border-right:1px solid #222}
.top{margin:10px;border:1px solid #d4af37;border-radius:18px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:#141414}
.top b{color:#d4af37;font-size:26px;letter-spacing:.3px}
.live{font-size:11px;background:#1a1a1a;border:1px solid #d4af37;color:#d4af37;padding:4px 8px;border-radius:20px}
#map{height:380px;margin:10px;border-radius:18px;border:2px solid #2a2a2a;z-index:1}
.card{margin:10px;border:1px solid #d4af37;border-radius:16px;background:#171717;padding:12px}
.badge{background:#d4af37;color:#000;font-weight:800;font-size:12px;padding:6px 10px;border-radius:20px;display:inline-block}
.kpi{display:flex;justify-content:space-between;margin-top:12px}
.kpi div{flex:1}
.kpi small{color:#aaa;font-size:11px}
.fare{color:#00ff88;font-weight:900;font-size:22px}
.earn{color:#00ff88;font-weight:900;font-size:20px}
.dist{font-weight:900;font-size:18px}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:13px;border-radius:12px;border:0;font-weight:900;font-size:15px;cursor:pointer}
.gold{background:#d4af37;color:#000}
.white{background:#fff;color:#000}
.green{background:#18a957;color:#fff}
.pin{width:32px;height:32px;background:#1f9d4d;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg)}
</style>
</head>
<body>
<div class="app">
<div class="top"><div style="display:flex;align-items:center;gap:10px"><div class="pin"><span>🛣️</span></div><b>OlexPress</b></div><div class="live">LIVE • Nyandarua</div></div>
<center style="color:#d4af37;font-size:12px">Your Ride Everywhere • BASE 250 + 42/km</center>
<div id="map"></div>
<div id="jobsList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDc6N5dULG6i72EWrlTtunwhbKQxaVi2KY",
  authDomain: "olexpresske.firebaseapp.com",
  databaseURL: "https://olexpresske-default-rtdb.firebaseio.com",
  projectId: "olexpresske",
  storageBucket: "olexpresske.firebasestorage.app",
  messagingSenderId: "953335654623",
  appId: "1:953335654623:web:1b91cbd29c1f63a23ba16a"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let map=L.map('map').setView([-0.5333,36.45],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let ms=[];

function loadDriver(){
 db.ref('jobs').limitToLast(30).on('value', snap=>{
  const data=snap.val()||{};
  const list=document.getElementById('jobsList');
  list.innerHTML=""; ms.forEach(m=>map.removeLayer(m)); ms=[];
  Object.entries(data).reverse().forEach(([id,j])=>{
    if(j.status==='completed') return;
    if(!j.pickup||!j.drop) return;
    const mins=Math.max(1, Math.floor((Date.now()-j.created)/60000));
    const driverPay=Math.round(j.fare*0.864);
    const olexPay=Math.round(j.fare*0.136);
    list.innerHTML+=`
    <div class="card">
      <span class="badge">🚖 Incoming Ride Request • ${mins} min ago</span>
      <div style="margin-top:10px;display:flex;gap:10px;align-items:center">
        <div style="width:40px;height:40px;background:#d4af37;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900">${(j.customer||'K')[0]}</div>
        <div><b>${j.customer||'Customer'}</b><br><small style="color:#d4af37">5★ • Verified Customer</small></div>
      </div>
      <div class="kpi">
        <div><small>💲 Fare (KES)</small><div class="fare">KES ${j.fare}</div></div>
        <div><small>📍 Distance</small><div class="dist">${j.distance} km</div></div>
        <div><small>💰 Your Earnings</small><div class="earn">KES ${driverPay}</div></div>
      </div>
      <div style="background:#1e1e1e;border-radius:12px;padding:10px;margin-top:10px;font-size:13px">
        <div>🟢 Pickup: ${j.pickup.lat.toFixed(4)}, ${j.pickup.lng.toFixed(4)}</div>
        <div style="margin-top:6px">🔴 Drop-off: ${j.drop.lat.toFixed(4)}, ${j.drop.lng.toFixed(4)}</div>
        <div style="margin-top:6px;color:#999">BASE 250 + ${j.distance}×42 = ${j.fare} | Olex KES ${olexPay}</div>
      </div>
      <div class="btns">
        <button class="btn gold" onclick="acceptJob('${id}')">Accept</button>
        <button class="btn white" onclick="nav(${j.pickup.lat},${j.pickup.lng},${j.drop.lat},${j.drop.lng})">Navigate</button>
        <button class="btn green" onclick="doneJob('${id}')">Done</button>
      </div>
    </div>`;
    ms.push(L.marker([j.pickup.lat,j.pickup.lng]).addTo(map));
    ms.push(L.marker([j.drop.lat,j.drop.lng]).addTo(map));
  });
  if(ms.length){ try{map.fitBounds(L.featureGroup(ms).getBounds().pad(0.3))}catch(e){} }
 });
}
loadDriver();
function acceptJob(id){ db.ref('jobs/'+id).update({status:'accepted'}); }
function doneJob(id){ if(confirm('Mark as Done?')) db.ref('jobs/'+id).update({status:'completed'}); }
function nav(a,b,c,d){ window.open(`https://www.google.com/maps/dir/${a},${b}/${c},${d}/`,'_blank'); }
</script>
</body>
</html>
