<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OlexPress Driver</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f172a">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:white;padding:10px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;margin:10px 0}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white;margin:6px 0}
button{padding:12px;border-radius:10px;border:0;font-weight:800;cursor:pointer;margin:4px 0}
#map{height:300px;border-radius:12px;border:2px solid #22c55e;margin:10px 0}
.ride{background:#0f172a;padding:12px;border-radius:10px;margin:8px 0;border:1px solid #334155;border-left:4px solid #22c55e}
</style>
</head>
<body>

<div style="background:linear-gradient(135deg,#16a34a,#15803d);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center">
<div><div style="font-weight:900">🚕 OlexPress DRIVER</div><div style="font-size:11px;opacity:.9">XXX Fleet - Accept & Complete Trips</div></div>
<div id="driverStatus" style="background:white;color:#16a34a;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800">OFFLINE</div>
</div>

<div class="card">
<input id="driverName" placeholder="Driver Name">
<input id="driverPhone" placeholder="Driver Phone 07...">
<input id="vehicleNo" placeholder="Vehicle No (optional)">
<button onclick="goOnline()" style="background:#22c55e;color:white;width:100%">🟢 GO ONLINE - See All Tickets</button>
<button onclick="goOffline()" style="background:#334155;color:white;width:100%">🔴 GO OFFLINE</button>
<div id="loginInfo" style="font-size:10px;color:#94a3b8;margin-top:6px">Go online to see all bookings</div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between"><h3 style="font-size:13px">🗺️ Live Map</h3><button onclick="centerMap()" style="width:auto;padding:6px 12px;background:#3b82f6;color:white;font-size:10px">Center</button></div>
<div id="map"></div>
<div id="mapInfo" style="font-size:10px;color:#94a3b8;margin-top:6px;background:#0f172a;padding:6px;border-radius:6px">Map shows pickup & destination</div>
</div>

<div id="activeRide" style="display:none" class="card"></div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<h3 style="font-size:13px">📋 All Bookings</h3>
<select id="filterStatus" onchange="loadAllRides()" style="width:auto;padding:6px;font-size:11px;background:#0f172a;color:white;border:1px solid #334155"><option value="all">All</option><option value="pending">Pending</option><option value="accepted">Accepted</option><option value="arrived">Arrived</option><option value="boarding_requested">Boarding</option><option value="boarded">On Trip</option><option value="pay_initiated">Pay</option><option value="paid">Paid</option><option value="completed">Done</option></select>
<button onclick="loadAllRides()" style="width:auto;padding:6px 12px;background:#16a34a;color:white;font-size:11px">🔄 Refresh</button>
</div>
<div id="ridesList"><div style="text-align:center;padding:20px;color:#94a3b8;font-size:11px">Go online to see tickets</div></div>
</div>

<script>
var firebaseConfig={apiKey:"AIzaSyD4...",authDomain:"olexpresske.firebaseapp.com",databaseURL:"https://olexpresske-default-rtdb.firebaseio.com",projectId:"olexpresske"};
firebase.initializeApp(firebaseConfig);var db=firebase.database();
let map, driverMarker, pickupMarker, destMarker, routeLine, markers=[];
let driverOnline=false, driverData=null, activeRideId=null;

function initMap(){map=L.map('map').setView([-0.3,36.3],9); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'OlexPress'}).addTo(map);}
initMap();
function centerMap(){map.setView([-0.3,36.3],9);}
function clearMarkers(){markers.forEach(m=>map.removeLayer(m)); markers=[]; if(pickupMarker)map.removeLayer(pickupMarker); if(destMarker)map.removeLayer(destMarker); if(routeLine)map.removeLayer(routeLine);}

function goOnline(){
let name=document.getElementById('driverName').value.trim();
let phone=document.getElementById('driverPhone').value.trim();
let vehicle=document.getElementById('vehicleNo').value.trim()||'KDA 123X';
if(!name){name=localStorage.getItem('last_driver_name')||'XXX Fleet Driver'; document.getElementById('driverName').value=name;}
if(!phone){phone=localStorage.getItem('last_driver_phone')||'0710000000'; document.getElementById('driverPhone').value=phone;}
driverData={name:name,phone:phone,vehicle:vehicle};
localStorage.setItem('olex_driver',JSON.stringify(driverData));
localStorage.setItem('last_driver_name',name);
localStorage.setItem('last_driver_phone',phone);
document.getElementById('driverStatus').innerText='ONLINE - '+name;
document.getElementById('driverStatus').style.background='#22c55e';
document.getElementById('loginInfo').innerHTML=`✅ ${name} ${vehicle} - Active: ${localStorage.getItem('olex_driver_active')||'None'}`;
driverOnline=true;
let savedActive=localStorage.getItem('olex_driver_active');
if(savedActive){db.ref('rides/'+savedActive).once('value',s=>{let v=s.val(); if(v&&v.status!=='completed'){activeRideId=savedActive; showActiveRide(savedActive,v); viewOnMap(savedActive);} loadAllRides();});}
else{loadAllRides();}
if(navigator.geolocation){navigator.geolocation.watchPosition(p=>{if(driverMarker)map.removeLayer(driverMarker); driverMarker=L.marker([p.coords.latitude,p.coords.longitude],{icon:L.divIcon({html:'🚕',className:'',iconSize:[30,30]})}).addTo(map); if(activeRideId) db.ref('rides/'+activeRideId+'/driverLocation').set({lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now()});});}
}
function goOffline(){driverOnline=false; document.getElementById('driverStatus').innerText='OFFLINE'; document.getElementById('ridesList').innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8">Offline</div>';}

function loadAllRides(){
if(!driverOnline) return;
let filter=document.getElementById('filterStatus').value;
db.ref('rides').once('value',snap=>{
let rides=[]; snap.forEach(c=>rides.push({id:c.key,data:c.val()}));
rides.sort((a,b)=>(b.data.ts||0)-(a.data.ts||0));
let html=''; let count=0;
rides.forEach(r=>{
let v=r.data; if(filter!=='all'&&v.status!==filter) return; count++;
let col={pending:'#f59e0b',accepted:'#3b82f6',arrived:'#8b5cf6',boarding_requested:'#ec4899',boarded:'#06b6d4',pay_initiated:'#f97316',paid:'#22c55e',completed:'#16a34a'}[v.status]||'#64748b';
let isMy=activeRideId===r.id;
html+=`<div class="ride" style="border-left-color:${col};${isMy?'border:2px solid #22c55e;':''}"><div style="display:flex;justify-content:space-between"><b style="color:${col}">🎫 ${r.id}</b><span style="background:${col};color:white;padding:2px 8px;border-radius:10px;font-size:9px">${(v.status||'pending').toUpperCase()} ${v.clock||''}</span></div><div style="font-size:12px;margin-top:6px"><b>From:</b> ${v.from}</div><div style="font-size:12px"><b>To:</b> ${v.to}</div><div style="display:flex;gap:6px;margin-top:6px"><div style="flex:1;background:#1e293b;padding:6px;border-radius:6px"><div style="font-size:9px;color:#94a3b8">KM</div><div style="font-weight:800;color:#4ade80">${v.km}km</div></div><div style="flex:1;background:#16a34a;padding:6px;border-radius:6px;text-align:center"><div style="font-size:9px">Fare</div><div style="font-weight:900">KES ${v.fare}</div></div></div><div style="font-size:11px;margin-top:6px">👤 ${v.name} ${v.phone} ${v.driverName?'| 🚕 '+v.driverName:''}</div><div style="display:flex;gap:4px;margin-top:8px"><button onclick="viewOnMap('${r.id}')" style="background:#3b82f6;color:white;flex:1">🗺️ Map</button>${v.status==='pending'?`<button onclick="acceptRide('${r.id}')" style="background:#22c55e;color:white;flex:1">✅ ACCEPT</button>`:''}${v.status!=='pending'&&v.status!=='completed'?`<button onclick="openActive('${r.id}')" style="background:#f59e0b;color:white;flex:1">⚡ ACT</button>`:''}</div></div>`;
});
if(count===0) html='<div style="text-align:center;padding:20px;color:#94a3b8">No rides for filter '+filter+'</div>';
else html=`<div style="font-size:10px;color:#4ade80;margin-bottom:8px">${count} rides</div>`+html;
document.getElementById('ridesList').innerHTML=html;
});
}

function viewOnMap(rideId){
db.ref('rides/'+rideId).once('value',snap=>{
let v=snap.val(); if(!v) return;
clearMarkers();
if(v.fromCoords){pickupMarker=L.marker([v.fromCoords.lat,v.fromCoords.lng]).addTo(map).bindPopup(`From: ${v.from}<br>${rideId}`).openPopup(); markers.push(pickupMarker);}
if(v.toCoords){destMarker=L.marker([v.toCoords.lat,v.toCoords.lng]).addTo(map).bindPopup(`To: ${v.to}<br>${rideId}`); markers.push(destMarker);}
if(v.fromCoords&&v.toCoords){routeLine=L.polyline([[v.fromCoords.lat,v.fromCoords.lng],[v.toCoords.lat,v.toCoords.lng]],{color:'#22c55e',weight:3,dashArray:'10,10'}).addTo(map); markers.push(routeLine); map.fitBounds([[v.fromCoords.lat,v.fromCoords.lng],[v.toCoords.lat,v.toCoords.lng]],{padding:[50,50]});}
else if(v.fromCoords) map.setView([v.fromCoords.lat,v.fromCoords.lng],13);
document.getElementById('mapInfo').innerHTML=`${rideId}: ${v.from} → ${v.to} | KES ${v.fare}`;
});
}
function acceptRide(rideId){
if(!driverData) return;
db.ref('rides/'+rideId).once('value',snap=>{
let v=snap.val(); if(v.status!=='pending') return alert('Already '+v.status);
if(activeRideId) return alert('Complete active '+activeRideId+' first');
db.ref('rides/'+rideId).update({status:'accepted',driverName:driverData.name,driverPhone:driverData.phone,vehicle:driverData.vehicle,acceptedAt:Date.now()}).then(()=>{activeRideId=rideId; localStorage.setItem('olex_driver_active',rideId); showActiveRide(rideId,{...v,status:'accepted'}); viewOnMap(rideId); loadAllRides();});
});
}
function openActive(rideId){db.ref('rides/'+rideId).once('value',s=>{let v=s.val(); if(!v)return; activeRideId=rideId; localStorage.setItem('olex_driver_active',rideId); showActiveRide(rideId,v); viewOnMap(rideId);});}
function showActiveRide(rideId,data){
document.getElementById('activeRide').style.display='block';
document.getElementById('activeRide').innerHTML=`<div style="display:flex;justify-content:space-between"><b>🚕 ${rideId}</b><span style="background:#f59e0b;padding:4px 10px;border-radius:12px;font-size:10px;color:white" id="driverStatusBadge">${(data.status||'').toUpperCase()}</span></div><div style="background:#0f172a;padding:10px;border-radius:8px;margin-top:8px"><div style="font-size:12px"><b>From:</b> ${data.from}</div><div style="font-size:12px"><b>To:</b> ${data.to}</div><div style="font-size:11px;margin-top:6px">👤 ${data.name} ${data.phone} | KES ${data.fare} | ${data.km}km</div></div><div id="driverActions" style="margin-top:10px"></div>`;
trackDriverRide(rideId);
}
function trackDriverRide(rideId){
db.ref('rides/'+rideId).on('value',snap=>{
let v=snap.val(); if(!v) return;
let badge=document.getElementById('driverStatusBadge'); if(badge) badge.innerText=(v.status||'').toUpperCase();
let actions=document.getElementById('driverActions');
let btn='';
if(v.status==='accepted') btn=`<button onclick="driverArrived('${rideId}')" style="background:#3b82f6;color:white;width:100%">📍 I HAVE ARRIVED</button>`;
else if(v.status==='arrived') btn=`<button onclick="requestBoarding('${rideId}')" style="background:#f59e0b;color:white;width:100%">🎫 REQUEST BOARDING</button>`;
else if(v.status==='boarding_requested') btn=`<div style="background:#fffbeb;color:#0f172a;padding:8px;border-radius:8px">Waiting client accept...</div>`;
else if(v.status==='boarded') btn=`<button onclick="initiatePay('${rideId}')" style="background:#f97316;color:white;width:100%">💰 REACHED - PAY KES ${v.fare}</button>`;
else if(v.status==='pay_initiated') btn=`<div style="background:#fffbeb;color:#0f172a;padding:8px;border-radius:8px">Waiting client pay...</div>`;
else if(v.status==='paid') btn=`<button onclick="completeRide('${rideId}')" style="background:#22c55e;color:white;width:100%">✅ COMPLETE RIDE</button>`;
else if(v.status==='completed') btn=`<div style="background:#f0fdf4;color:#0f172a;padding:10px;border-radius:8px;text-align:center">✅ Done ${v.feedback?`⭐ ${v.feedback.stars} ${v.feedback.text}`:''}<br><button onclick="clearActive()" style="background:#334155;color:white;margin-top:8px;width:100%">Clear - New Trip</button></div>`;
if(actions) actions.innerHTML=btn;
loadAllRides();
});
}
function driverArrived(id){db.ref('rides/'+id).update({status:'arrived'});}
function requestBoarding(id){db.ref('rides/'+id).update({status:'boarding_requested'});}
function initiatePay(id){db.ref('rides/'+id).update({status:'pay_initiated'});}
function completeRide(id){db.ref('rides/'+id).update({status:'completed',completedAt:Date.now()}).then(()=>clearActive());}
function clearActive(){activeRideId=null; localStorage.removeItem('olex_driver_active'); document.getElementById('activeRide').style.display='none'; loadAllRides();}
let saved=localStorage.getItem('olex_driver'); if(saved){let d=JSON.parse(saved); document.getElementById('driverName').value=d.name||''; document.getElementById('driverPhone').value=d.phone||''; document.getElementById('vehicleNo').value=d.vehicle||'';}
</script>
</body>
</html>
