<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLEX Driver</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>body{font-family:system-ui;background:#0f172a;color:#fff;margin:0;padding:12px}
.card{background:#1e293b;border-radius:16px;padding:14px;margin:10px 0;border-left:5px solid #22c55e}
.btn{padding:10px 16px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin:5px}
.accept{background:#22c55e;color:#000} .onboard{background:#f59e0b;color:#000} .done{background:#ef4444;color:#fff}
</style></head><body>
<h1>🚗 OLEX Driver Panel - LIVE</h1>
<div id="list">Loading...</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDc6N5dULG6i72EWrLTtunwhbKQxaVi2KY",
  authDomain: "olexpresske.firebaseapp.com",
  databaseURL: "https://olexpresske-default-rtdb.firebaseio.com",
  projectId: "olexpresske",
  storageBucket: "olexpresske.firebasestorage.app",
  messagingSenderId: "953335654623",
  appId: "1:953335654623:web:1b91cbd29c1f63a23ba16a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
db.ref('rides').on('value', snap=>{
  const list = document.getElementById('list'); list.innerHTML='';
  const data = snap.val(); if(!data){list.innerHTML='No rides';return}
  Object.entries(data).reverse().forEach(([id,ride])=>{
    if(ride.status==='completed') return;
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<h2>${ride.from} → ${ride.to} #${id.slice(-5)}</h2>
      <p>👤 ${ride.name} | 📞 ${ride.phone} | 💺 ${ride.seats} | KES ${ride.price}</p>
      <p>Status: <b>${ride.status}</b> | Boarded: ${ride.customerBoarded?'✅ YES':'❌ NO'}</p>
      ${ride.status==='pending'?`<button class="btn accept" onclick="firebase.database().ref('rides/${id}').update({status:'accepted'})">✅ ACCEPT</button>`:''}
      ${ride.status==='accepted'?`<button class="btn onboard" onclick="firebase.database().ref('rides/${id}').update({status:'onboard'})">🟡 ONBOARD</button>`:''}
      ${ride.status==='onboard'?`<button class="btn done" onclick="firebase.database().ref('rides/${id}').update({status:'completed'})">🏁 DESTINATION REACHED</button>`:''}
      <p><a href="track.html?id=${id}" style="color:#22c55e">track link</a></p>`;
    list.appendChild(div);
  });
});
</script></body></html>
