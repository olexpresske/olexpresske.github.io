<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OlexPress KE - Book</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff}
.page{max-width:1100px;margin:0 auto;padding:12px}
#map{height:480px;border-radius:18px;z-index:1;border:2px solid #d4af37}
.card{background:#141414;padding:16px;border-radius:18px;margin-top:12px;border:1px solid #333}
.logo{height:46px;background:#fff;padding:6px;border-radius:8px}
h2{color:#d4af37;margin:8px 0}
button{background:#d4af37;color:#000;border:0;padding:14px 22px;border-radius:12px;font-weight:800;width:100%;font-size:18px;cursor:pointer}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;margin:6px 0}
</style>
</head>
<body>
<div class="page">
<img src="./logo.png" class="logo" onerror="this.style.display='none'">
<h3 style="color:#d4af37">OLEX PRESS - NYANDARUA</h3>
<div id="map"></div>
<div class="card">
<input id="cName" placeholder="Your Name / Phone">
<p>Pickup: <b id="pickTxt" style="color:#d4af37">Click map for pickup</b></p>
<p>Drop: <b id="dropTxt" style="color:#d4af37">Click map for drop</b></p>
<h2>FARE: KES <span id="fare">0</span></h2>
<p><span id="km">0.0</span> km × 42 + Base 250</p>
<button onclick="bookNow()">BOOK OLEXPRESS NOW</button>
<p id="status"></p>
</div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDc6N5dULG6i72EWrlTtunwhbKQxaVi2KY",
  authDomain: "olexpresske.firebaseapp.com",
  databaseURL: "https://olexpresske-default-rtdb.firebaseio.com",
  projectId: "olexpresske",
  storageBucket: "olexpresske.firebasestorage.app",
  messagingSenderId: "953335654623",
  appId: "1:953335654623:web:1b91cbd29c1f63a23ba16a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const BASE=250, PERKM=42;
let pick=null, drop=null, m1,m2, distKm=0, finalFare=0;

let map=L.map('map').setView([-0.5333,36.45],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

map.on('click',e=>{
 if(!pick){
   pick=e.latlng; if(m1)map.removeLayer(m1); m1=L.marker(pick).addTo(map).bindPopup("Pickup").openPopup();
   document.getElementById('pickTxt').innerText=pick.lat.toFixed(5)+","+pick.lng.toFixed(5);
 } else if(!drop){
   drop=e.latlng; if(m2)map.removeLayer(m2); m2=L.marker(drop).addTo(map).bindPopup("Drop").openPopup();
   distKm = map.distance(pick,drop)/1000;
   finalFare = Math.round(BASE + distKm*PERKM);
   document.getElementById('dropTxt').innerText=drop.lat.toFixed(5)+","+drop.lng.toFixed(5);
   document.getElementById('km').innerText=distKm.toFixed(1);
   document.getElementById('fare').innerText=finalFare;
 } else {
   if(m1)map.removeLayer(m1); if(m2)map.removeLayer(m2);
   pick=e.latlng; drop=null; distKm=0; finalFare=0;
   m1=L.marker(pick).addTo(map);
   document.getElementById('pickTxt').innerText=pick.lat.toFixed(5)+","+pick.lng.toFixed(5);
   document.getElementById('dropTxt').innerText="Click map for drop";
   document.getElementById('km').innerText="0.0"; document.getElementById('fare').innerText="0";
 }
});

function bookNow(){
 const name=document.getElementById('cName').value.trim();
 if(!name){alert("Enter name/phone");return;}
 if(!pick||!drop){alert("Pick pickup and drop on map");return;}
 document.getElementById('status').innerText="Saving...";
 db.ref('jobs').push({
   customer:name,
   pickup:{lat:pick.lat,lng:pick.lng},
   drop:{lat:drop.lat,lng:drop.lng},
   distance:parseFloat(distKm.toFixed(2)),
   fare:finalFare,
   base:BASE, perKm:PERKM,
   status:"pending",
   created:Date.now()
 }).then(()=>{
   document.getElementById('status').innerText="✅ Booked! Driver will call - KES "+finalFare;
   // reset after 2s
   setTimeout(()=>{ location.reload(); },2000);
 }).catch(err=>{
   document.getElementById('status').innerText="Error: "+err.message;
 });
}
</script>
</body>
</html>
