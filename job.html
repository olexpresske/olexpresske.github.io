<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{margin:0;font-family:system-ui;background:#f6f6f6}
.page{max-width:1100px;margin:0 auto;padding:12px}
#map{height:420px;border-radius:18px;z-index:1}
.card{background:#fff;padding:14px;border-radius:16px;margin-top:12px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
img.logo{height:42px}
</style>
</head>
<body>
<div class="page">
<img src="./logo.png" class="logo" onerror="this.style.display='none'">
<div id="map"></div>
<div class="card">
<p>Pickup: <b id="pickTxt">Click map</b></p>
<p>Drop: <b id="dropTxt">Click map</b></p>
<h2>KES <span id="fare">0</span> | <span id="km">0</span> km</h2>
<small>250 + distance × 42</small><br><br>
<button onclick="book()">Book OlexPress</button>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BASE=250, PERKM=42;
let pick=null, drop=null, m1, m2;
let map=L.map('map').setView([-0.533,36.45],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
map.on('click',e=>{
 if(!pick){pick=e.latlng; m1=L.marker(pick).addTo(map); document.getElementById('pickTxt').innerText=pick.lat.toFixed(4)+','+pick.lng.toFixed(4);}
 else if(!drop){drop=e.latlng; m2=L.marker(drop).addTo(map); let d=map.distance(pick,drop)/1000; document.getElementById('km').innerText=d.toFixed(1); document.getElementById('fare').innerText=Math.round(BASE+d*PERKM); document.getElementById('dropTxt').innerText=drop.lat.toFixed(4)+','+drop.lng.toFixed(4);}
 else{ if(m1)map.removeLayer(m1); if(m2)map.removeLayer(m2); pick=e.latlng; drop=null; m1=L.marker(pick).addTo(map); document.getElementById('fare').innerText='0'; document.getElementById('km').innerText='0';}
});
function book(){ if(!pick||!drop){alert('Pick both points');return;} alert('Booked! Fare KES '+document.getElementById('fare').innerText); }
</script>
</body>
</html>
